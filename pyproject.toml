[project]
name = "quota-sentinel"
version = "0.1.0"
description = "macOS-first local AI quota scheduler and Feishu notifier"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
feishu = ["lark-oapi>=1.4.0"]
secret-service = [
  "secretstorage>=3.3.3,<3.4; sys_platform == 'linux' and python_version < '3.10'",
  "secretstorage>=3.4,<4; sys_platform == 'linux' and python_version >= '3.10'",
]
kwallet = ["dbus-python>=1.3.2,<2; sys_platform == 'linux'"]

[project.scripts]
quota-sentinel = "quota_sentinel.__main__:main"

[build-system]
# Exact-pinned: uv does NOT record build-system requires in uv.lock, so
# the editable build would otherwise float a fresh hatchling resolve on
# every sync. 1.32.4 is the version the project has actually built with.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

# Package implementations and helper resources; root scripts preserve source entry names.
[tool.hatch.build.targets.wheel]
packages = ["quota_sentinel"]
